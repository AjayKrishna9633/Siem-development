# Security headers for the static app. Included in each location rather than set once on the
# server, because nginx drops server-level add_header lines in any location that has its own
# add_header (Cache-Control). `always` adds them to error responses too.

# Content Security Policy:
# - scripts only from our own origin: the Vite build has no inline scripts
# - styles from our origin and Google Fonts; 'unsafe-inline' because the toast library (sonner)
#   injects a <style> tag at runtime
# - font files from Google Fonts' CDN
# - API calls and WebSockets only to our own origin (/api)
# - the page can't be framed (clickjacking), and <base>/form targets can't be redirected
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
# Older browsers that ignore frame-ancestors.
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# No Strict-Transport-Security here: the default install is plain HTTP, where HSTS is ignored, and
# when HTTPS is enabled the Caddy proxy in front is the right place for it.
