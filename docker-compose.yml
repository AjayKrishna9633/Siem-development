name: siemple

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'
    labels: com.docker.compose.project,com.docker.compose.service

x-api-env: &api-env
  NODE_ENV: production
  PORT: '4000'
  # Must be URL-safe.
  DATABASE_URL: postgres://${POSTGRES_USER:-siemple}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-siemple}
  REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (at least 32 characters)}
  APP_URL: ${APP_URL:-http://localhost}
  TRUST_PROXY: '1'
  LOG_LEVEL: ${LOG_LEVEL:-}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_SECURE: ${SMTP_SECURE:-}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-}
  WAZUH_API_URL: https://wazuh-manager:55000
  WAZUH_API_USER: ${WAZUH_API_USER:-siemple-api}
  WAZUH_API_PASSWORD: ${WAZUH_API_PASSWORD:?Set WAZUH_API_PASSWORD in .env}
  WAZUH_API_CA_FILE: /wazuh-ca/ca.crt
  WAZUH_API_TLS_INSECURE: ${WAZUH_API_TLS_INSECURE:-false}
  WAZUH_PUBLIC_ADDRESS: ${WAZUH_PUBLIC_ADDRESS:-}
  WAZUH_ENROLLMENT_PASSWORD: ${WAZUH_ENROLLMENT_PASSWORD:?Set WAZUH_ENROLLMENT_PASSWORD in .env}
  WAZUH_AGENT_VERSION: ${WAZUH_AGENT_VERSION:-}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-siemple}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-siemple}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # $$ is a literal $, read inside the container.
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command: ['sh', '-c', 'exec redis-server --requirepass "$$REDIS_PASSWORD"']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging

  migrate:
    image: ${SIEMPLE_API_IMAGE:-ghcr.io/ajaykrishna9633/siemple-api}:${SIEMPLE_VERSION:-latest}
    build: ./backend
    command: ['node', 'dist/cli/migrate.js']
    restart: 'no'
    environment: *api-env
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    security_opt: ['no-new-privileges:true']
    logging: *logging

  api:
    image: ${SIEMPLE_API_IMAGE:-ghcr.io/ajaykrishna9633/siemple-api}:${SIEMPLE_VERSION:-latest}
    build: ./backend
    restart: unless-stopped
    environment: *api-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - wazuh-api-ca:/wazuh-ca:ro
    init: true
    read_only: true
    security_opt: ['no-new-privileges:true']
    stop_grace_period: 15s
    logging: *logging

  # Agents connect on 1514 (events) and enroll on 1515. The API (55000) stays internal.
  wazuh-manager:
    image: wazuh/wazuh-manager:4.14.10
    hostname: wazuh-manager
    restart: unless-stopped
    environment:
      API_USERNAME: ${WAZUH_API_USER:-siemple-api}
      API_PASSWORD: ${WAZUH_API_PASSWORD:?Set WAZUH_API_PASSWORD in .env}
      WAZUH_ENROLLMENT_PASSWORD: ${WAZUH_ENROLLMENT_PASSWORD:?Set WAZUH_ENROLLMENT_PASSWORD in .env}
    ports:
      - '1514:1514'
      - '1515:1515'
    configs:
      - source: wazuh-siemple-init
        target: /entrypoint-scripts/10-siemple.sh
      - source: wazuh-filebeat-down
        target: /etc/services.d/filebeat/down
    volumes:
      - wazuh-api-configuration:/var/ossec/api/configuration
      - wazuh-etc:/var/ossec/etc
      - wazuh-logs:/var/ossec/logs
      - wazuh-queue:/var/ossec/queue
      - wazuh-multigroups:/var/ossec/var/multigroups
      - wazuh-api-ca:/siemple-ca
    ulimits:
      nofile: { soft: 655360, hard: 655360 }
    logging: *logging

  web:
    image: ${SIEMPLE_WEB_IMAGE:-ghcr.io/ajaykrishna9633/siemple-web}:${SIEMPLE_VERSION:-latest}
    build: ./frontend
    restart: unless-stopped
    ports:
      - '${WEB_BIND:-0.0.0.0}:${WEB_PORT:-80}:80'
    environment:
      API_UPSTREAM: api:4000
      TRUSTED_PROXY: ${TRUSTED_PROXY:-}
    depends_on:
      api:
        condition: service_healthy
      caddy:
        condition: service_started
        required: false
    security_opt: ['no-new-privileges:true']
    logging: *logging

  loki:
    image: grafana/loki:3.7.10
    restart: unless-stopped
    command: ['-config.file=/etc/loki/config.yaml', '-config.expand-env=true']
    environment:
      LOKI_RETENTION: ${LOKI_RETENTION:-336h}
    configs:
      - source: loki-config
        target: /etc/loki/config.yaml
    volumes:
      - loki-data:/loki
    security_opt: ['no-new-privileges:true']
    logging: *logging

  # Ships this project's container logs to Loki. Reads the JSON log files read-only instead of
  # docker.sock (root on the host); other projects' lines are dropped.
  alloy:
    image: grafana/alloy:v1.21.3
    restart: unless-stopped
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=127.0.0.1:12345
      - --storage.path=/alloy-data
      - --disable-reporting
    environment:
      SIEMPLE_PROJECT: ${COMPOSE_PROJECT_NAME:-siemple}
      SIEMPLE_ENV: ${SIEMPLE_ENV:-production}
    configs:
      - source: alloy-config
        target: /etc/alloy/config.alloy
    volumes:
      - ${DOCKER_CONTAINERS_DIR:-/var/lib/docker/containers}:/var/lib/docker/containers:ro
      - alloy-data:/alloy-data
    depends_on:
      loki:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/12345 && printf 'GET /-/ready HTTP/1.0\r\n\r\n' >&3 && grep -q ' 200 ' <&3
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    # Root only to read the root-owned log files; no capabilities.
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    logging: *logging

  grafana:
    image: ${SIEMPLE_GRAFANA_IMAGE:-ghcr.io/ajaykrishna9633/siemple-grafana}:${SIEMPLE_VERSION:-latest}
    build: ./grafana
    restart: unless-stopped
    environment:
      GF_SERVER_ROOT_URL: ${APP_URL:-http://localhost}/grafana/
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_SECURITY_COOKIE_SECURE: ${GRAFANA_COOKIE_SECURE:-false}
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      loki:
        condition: service_started
    security_opt: ['no-new-privileges:true']
    logging: *logging

  caddy:
    image: caddy:2-alpine
    profiles: [https]
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp' # HTTP/3
    environment:
      DOMAIN: ${DOMAIN:-}
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    security_opt: ['no-new-privileges:true']
    logging: *logging

configs:
  # Inline so an install needs only this file and .env. {$$DOMAIN} reaches Caddy as {$DOMAIN}.
  caddyfile:
    content: |
      {$$DOMAIN} {
        header Strict-Transport-Security "max-age=31536000"
        reverse_proxy web:80
      }

  # Runs before Wazuh starts: enrollment password, no indexer (SIEMple has none), and an API
  # certificate from a private CA whose ca.crt the api container verifies against. $$ is a literal $.
  wazuh-siemple-init:
    content: |
      #!/bin/bash
      # SIEMple: enrollment password, no indexer, and an API certificate SIEMple can verify.
      set -euo pipefail

      if [ -z "$${WAZUH_ENROLLMENT_PASSWORD:-}" ]; then
        echo 'SIEMple: WAZUH_ENROLLMENT_PASSWORD is not set' >&2
        exit 1
      fi

      conf=/var/ossec/etc/ossec.conf
      sed -i 's#<use_password>no</use_password>#<use_password>yes</use_password>#' "$$conf"
      sed -i '/<vulnerability-detection>/,/<\/vulnerability-detection>/ s#<enabled>yes</enabled>#<enabled>no</enabled>#' "$$conf"
      sed -i '/<indexer>/,/<\/indexer>/ s#<enabled>yes</enabled>#<enabled>no</enabled>#' "$$conf"

      printf '%s\n' "$$WAZUH_ENROLLMENT_PASSWORD" > /var/ossec/etc/authd.pass
      chown root:wazuh /var/ossec/etc/authd.pass
      chmod 640 /var/ossec/etc/authd.pass

      ssl=/var/ossec/api/configuration/ssl
      if [ ! -s "$$ssl/siemple-ca.crt" ]; then
        work="$$(mktemp -d)"
        openssl req -x509 -newkey rsa:3072 -nodes -days 3650 -subj '/CN=SIEMple Wazuh API CA' \
          -keyout "$$work/ca.key" -out "$$work/ca.crt" 2>/dev/null
        openssl req -newkey rsa:3072 -nodes -subj '/CN=wazuh-manager' \
          -keyout "$$work/server.key" -out "$$work/server.csr" 2>/dev/null
        printf 'subjectAltName=DNS:wazuh-manager,DNS:localhost\nbasicConstraints=CA:FALSE\nextendedKeyUsage=serverAuth\n' > "$$work/server.ext"
        openssl x509 -req -in "$$work/server.csr" -CA "$$work/ca.crt" -CAkey "$$work/ca.key" \
          -CAcreateserial -days 3650 -extfile "$$work/server.ext" -out "$$work/server.crt" 2>/dev/null
        install -o wazuh -g wazuh -m 400 "$$work/server.key" "$$ssl/server.key"
        install -o wazuh -g wazuh -m 400 "$$work/server.crt" "$$ssl/server.crt"
        install -o root -g wazuh -m 644 "$$work/ca.crt" "$$ssl/siemple-ca.crt"
        rm -rf "$$work"
      fi
      install -m 644 "$$ssl/siemple-ca.crt" /siemple-ca/ca.crt

  # Filebeat ships to a Wazuh indexer, which SIEMple doesn't run.
  wazuh-filebeat-down:
    content: |
      SIEMple runs no Wazuh indexer

  # Single-process Loki on the loki-data volume. $${…} is filled by -config.expand-env.
  loki-config:
    content: |
      auth_enabled: false # one tenant; only Alloy and Grafana can reach Loki
      server:
        http_listen_port: 3100
        log_level: warn
      common:
        instance_addr: 127.0.0.1
        path_prefix: /loki
        replication_factor: 1
        ring:
          kvstore:
            store: inmemory
        storage:
          filesystem:
            chunks_directory: /loki/chunks
            rules_directory: /loki/rules
      schema_config:
        configs:
          - from: 2026-01-01
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: index_
              period: 24h
      limits_config:
        retention_period: $${LOKI_RETENTION:-336h}
        discover_service_name: []
        discover_log_levels: false
        volume_enabled: true
      compactor:
        working_directory: /loki/compactor
        retention_enabled: true
        delete_request_store: filesystem
      analytics:
        reporting_enabled: false

  # $$ reaches Alloy as $.
  alloy-config:
    content: |
      local.file_match "containers" {
        path_targets = [{"__path__" = "/var/lib/docker/containers/*/*-json.log"}]
        sync_period  = "10s"
      }

      loki.source.file "containers" {
        targets    = local.file_match.containers.targets
        forward_to = [loki.process.siemple.receiver]
      }

      loki.process "siemple" {
        stage.json {
          expressions = {
            line    = "log",
            time    = "time",
            project = "attrs.\"com.docker.compose.project\"",
            service = "attrs.\"com.docker.compose.service\"",
          }
        }

        stage.labels {
          values = { project = "", service = "" }
        }
        stage.match {
          selector = "{project!=\"" + sys.env("SIEMPLE_PROJECT") + "\"}"
          action   = "drop"
          drop_counter_reason = "other_project"
        }

        stage.timestamp {
          source = "time"
          format = "RFC3339Nano"
        }
        stage.output {
          source = "line"
        }

        // The setup token is a secret: never send it.
        stage.drop {
          expression          = ".*SIEMple setup token.*"
          drop_counter_reason = "secret"
        }
        stage.drop {
          expression          = ".*\"GET /(api/)?health(z)?[^ \"]* HTTP/[0-9.]+\" 200 .*"
          drop_counter_reason = "healthcheck"
        }
        stage.drop {
          expression          = ".*\"msg\":\"GET /(api/)?health 200\".*"
          drop_counter_reason = "healthcheck"
        }

        stage.json {
          expressions = { json_level = "level" }
        }
        stage.regex {
          expression = "(?i)(?:level=|\\[)(?P<tag_level>fatal|panic|error|warning|warn)\\b"
        }
        stage.regex {
          expression = "\\b(?P<pg_level>FATAL|PANIC|ERROR|WARNING):"
        }
        stage.template {
          source   = "level"
          template = "{{ $$l := or .json_level .tag_level .pg_level \"info\" | ToLower }}{{ if eq $$l \"warning\" }}warn{{ else if eq $$l \"panic\" }}fatal{{ else }}{{ $$l }}{{ end }}"
        }
        stage.labels {
          values = { level = "" }
        }

        stage.static_labels {
          values = { env = sys.env("SIEMPLE_ENV") }
        }
        stage.label_keep {
          values = ["service", "level", "env"]
        }

        forward_to = [loki.write.local.receiver]
      }

      loki.write "local" {
        endpoint {
          url = "http://loki:3100/loki/api/v1/push"
        }
      }

volumes:
  pgdata:
  wazuh-api-configuration:
  wazuh-etc:
  wazuh-logs:
  wazuh-queue:
  wazuh-multigroups:
  wazuh-api-ca:
  redisdata:
  loki-data:
  alloy-data:
  grafana-data:
  caddy_data:
  caddy_config:
