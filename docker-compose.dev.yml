name: siemple-dev

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: siemple
      POSTGRES_PASSWORD: siemple
      POSTGRES_DB: siemple_dev
    ports:
      - '127.0.0.1:${DB_PORT:-5433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    configs:
      - source: create-test-db
        target: /docker-entrypoint-initdb.d/10-create-test-db.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U siemple -d siemple_dev']
      interval: 2s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 5s
      retries: 15

configs:
  create-test-db:
    content: |
      CREATE DATABASE siemple_test;

volumes:
  pgdata:
