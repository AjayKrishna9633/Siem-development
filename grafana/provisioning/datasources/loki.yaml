# Fixed uid: the dashboards refer to it.
apiVersion: 1

datasources:
  - name: Loki
    uid: siemple-loki
    type: loki
    access: proxy
    url: ${LOKI_URL}
    isDefault: true
    editable: false
    jsonData:
      maxLines: 1000
      # Logs Drilldown needs the tenant named; single-tenant Loki uses "fake".
      httpHeaderName1: X-Scope-OrgID
    secureJsonData:
      httpHeaderValue1: fake
