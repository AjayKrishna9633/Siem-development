# The Loki in the same stack. ${LOKI_URL} is filled from the container's environment
# (http://loki:3100 unless compose overrides it). The fixed uid is what the dashboards refer to.
apiVersion: 1

datasources:
  - name: Loki
    uid: siemple-loki
    type: loki
    access: proxy
    url: ${LOKI_URL}
    isDefault: true
    editable: false
    jsonData:
      maxLines: 1000
      # Loki runs single-tenant (auth_enabled: false) and files everything under the tenant
      # "fake". A few newer endpoints that Logs Drilldown calls still insist on being told the
      # tenant, so name it; every other request lands in the same tenant either way.
      httpHeaderName1: X-Scope-OrgID
    secureJsonData:
      httpHeaderValue1: fake
