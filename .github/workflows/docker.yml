name: Docker

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'grafana/**'
      - 'docker-compose.yml'
      - 'docker-compose.dev.yml'
      - '.env.example'
      - 'install.sh'
      - '.github/workflows/docker.yml'
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE_PREFIX: ghcr.io/ajaykrishna9633/siemple

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # shellcheck is preinstalled on GitHub's Ubuntu runners.
      - name: Lint shell scripts
        run: shellcheck install.sh frontend/nginx/40-siemple-real-ip.sh

      - name: Validate docker-compose.yml against .env.example
        run: |
          cp .env.example .env
          sed -i -e 's/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=ci/' \
                 -e 's/^REDIS_PASSWORD=$/REDIS_PASSWORD=ci/' \
                 -e 's/^JWT_SECRET=$/JWT_SECRET=ci-secret-that-is-at-least-32-characters/' \
                 -e 's/^GRAFANA_ADMIN_PASSWORD=$/GRAFANA_ADMIN_PASSWORD=ci/' \
                 -e 's/^WAZUH_API_PASSWORD=$/WAZUH_API_PASSWORD=Ci-api-pass.1/' \
                 -e 's/^WAZUH_ENROLLMENT_PASSWORD=$/WAZUH_ENROLLMENT_PASSWORD=ci-enrollment-password-20/' \
                 -e 's/^ENROLL_DB_PASSWORD=$/ENROLL_DB_PASSWORD=ci-enroll-db-password-0000/' \
                 -e 's#^ENROLL_KEY_SECRET=$#ENROLL_KEY_SECRET=Y2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2M=#' .env
          docker compose config --quiet
          COMPOSE_PROFILES=https DOMAIN=siem.example.com docker compose config --quiet
          docker compose -f docker-compose.dev.yml config --quiet

      - name: Validate the Alloy config
        run: |
          image="$(docker compose config --format json | jq -r '.services.alloy.image')"
          docker compose config --format json | jq -r '.configs["alloy-config"].content' > config.alloy
          docker run --rm -v "$PWD/config.alloy:/config.alloy:ro" "$image" fmt /config.alloy > /dev/null

  images:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR
      security-events: write # upload scan results to the Security tab
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: backend
            title: SIEMple API
          - name: web
            context: frontend
            title: SIEMple web
          - name: grafana
            context: grafana
            title: SIEMple Grafana
          - name: enroll
            context: backend
            dockerfile: Dockerfile.enroll
            title: SIEMple enrollment service
    env:
      PUBLISH: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        if: env.PUBLISH == 'true'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=ref,event=pr
            type=sha,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.title }} for SIEMple, a self-hosted SIEM

      - name: Build for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.dockerfile || 'Dockerfile' }}
          platforms: linux/amd64
          load: true
          push: false
          tags: siemple-${{ matrix.name }}:scan
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: siemple-${{ matrix.name }}:scan
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: '0'

      - name: Upload scan results
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif
          category: trivy-${{ matrix.name }}

      - name: Build and publish
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.dockerfile || 'Dockerfile' }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
          provenance: mode=max
          sbom: true

  release:
    needs: images
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # GitHub renames dotfiles, so it ships as env.example.
      - name: Collect install files
        run: |
          mkdir release
          cp docker-compose.yml install.sh release/
          cp .env.example release/env.example

      - name: Publish release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: release/*
          fail_on_unmatched_files: true
          overwrite_files: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') && 'true' || 'false' }}
