# Builds, scans and publishes the SIEMple container images.
#
#   pull request -> check the install files, build the images, scan them (nothing is published)
#   push to main -> also publish :main and :sha-<commit> (for testing; `latest` doesn't move)
#   tag vX.Y.Z   -> also publish :X.Y.Z, :X.Y and :latest, and attach the install files to the
#                   GitHub release that install.sh downloads from
#
# Third-party actions are pinned to a commit (tags can be moved); the comment names the release.

name: Docker

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'grafana/**'
      - 'docker-compose.yml'
      - 'docker-compose.dev.yml'
      - '.env.example'
      - 'install.sh'
      - '.github/workflows/docker.yml'
  push:
    branches: [main]
    # Semver tags only: the image tags and install.sh's version handling assume X.Y.Z.
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

# A new push to the same PR cancels its older run; main and tag runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege by default; jobs ask for more below.
permissions:
  contents: read

env:
  # Must match the image names in docker-compose.yml. GHCR names are lowercase.
  IMAGE_PREFIX: ghcr.io/ajaykrishna9633/siemple

jobs:
  # The files people install from: catch a broken script or compose file before it's released.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # shellcheck is preinstalled on GitHub's Ubuntu runners.
      - name: Lint shell scripts
        run: shellcheck install.sh frontend/nginx/40-siemple-real-ip.sh

      # The compose file must accept the shipped .env.example once secrets are filled in, in both
      # plain HTTP and HTTPS mode. Dummy values only: nothing is started.
      - name: Validate docker-compose.yml against .env.example
        run: |
          cp .env.example .env
          sed -i -e 's/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=ci/' \
                 -e 's/^REDIS_PASSWORD=$/REDIS_PASSWORD=ci/' \
                 -e 's/^JWT_SECRET=$/JWT_SECRET=ci-secret-that-is-at-least-32-characters/' \
                 -e 's/^GRAFANA_ADMIN_PASSWORD=$/GRAFANA_ADMIN_PASSWORD=ci/' .env
          docker compose config --quiet
          COMPOSE_PROFILES=https DOMAIN=siem.example.com docker compose config --quiet
          docker compose -f docker-compose.dev.yml config --quiet

      # The Alloy pipeline lives inline in docker-compose.yml; check it parses with the pinned Alloy.
      - name: Validate the Alloy config
        run: |
          image="$(docker compose config --format json | jq -r '.services.alloy.image')"
          docker compose config --format json | jq -r '.configs["alloy-config"].content' > config.alloy
          docker run --rm -v "$PWD/config.alloy:/config.alloy:ro" "$image" fmt /config.alloy > /dev/null

  images:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR
      security-events: write # upload scan results to the Security tab
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: backend
            title: SIEMple API
          - name: web
            context: frontend
            title: SIEMple web
          # Grafana with SIEMple's data source and dashboards built in.
          - name: grafana
            context: grafana
            title: SIEMple Grafana
    env:
      PUBLISH: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Emulation for the arm64 image (Raspberry Pi, ARM servers). Only needed when publishing.
      - name: Set up QEMU
        if: env.PUBLISH == 'true'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Works out the tags from the event. Tag v1.2.0 gives 1.2.0, 1.2 and latest (install.sh
      # writes the bare version into .env, so there's no `v`). A pre-release like v1.3.0-rc.1
      # gets only its own tag and never moves `latest`.
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=ref,event=pr
            type=sha,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.title }} for SIEMple, a self-hosted SIEM

      # Built once for amd64 and loaded locally so it can be scanned before anything is pushed.
      # The GitHub Actions cache makes the publish step below reuse these layers.
      - name: Build for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          load: true
          push: false
          tags: siemple-${{ matrix.name }}:scan
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

      # Reports fixable HIGH and CRITICAL vulnerabilities (OS packages and npm dependencies) to
      # the repository's Security > Code scanning page. It doesn't fail the build: a new CVE in
      # a base image shouldn't block a release on its own; review the findings there.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: siemple-${{ matrix.name }}:scan
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: '0'

      # PRs from forks get a read-only token that can't upload, so skip it there.
      - name: Upload scan results
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif
          category: trivy-${{ matrix.name }}

      # Multi-arch build and push. Layers come from the cache above; only arm64 is new work.
      # The provenance attestation and SBOM are stored next to the image in GHCR.
      - name: Build and publish
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
          provenance: mode=max
          sbom: true

  # Attaches the three files install.sh downloads to the GitHub release for the tag, creating
  # the release (with generated notes) if it doesn't exist yet. Runs only after all images
  # are published, so a release never points at images that aren't there.
  release:
    needs: images
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # GitHub renames uploaded files that start with a dot, so .env.example ships as
      # env.example (install.sh expects that name).
      - name: Collect install files
        run: |
          mkdir release
          cp docker-compose.yml install.sh release/
          cp .env.example release/env.example

      - name: Publish release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: release/*
          fail_on_unmatched_files: true
          overwrite_files: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          # Only a final release becomes "latest", which is what install.sh installs by default.
          make_latest: ${{ !contains(github.ref_name, '-') && 'true' || 'false' }}
